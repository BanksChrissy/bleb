name: Validate clinical atlas

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate JavaScript syntax
        run: node --check app.js
      - name: Validate Python syntax
        run: python -m py_compile tools/check_links.py tools/discover_recent.py tools/validate_catalog.py
      - name: Validate catalog data
        run: python tools/validate_catalog.py
