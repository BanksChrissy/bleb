name: Audit external guideline links

on:
  schedule:
    - cron: "17 9 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check reference links
        run: python tools/check_links.py
      - name: Publish audit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/link-status.json
          if ! git diff --cached --quiet; then
            git commit -m "Update weekly guideline link health audit"
            git push
          fi
